# 一行啟動整個平台（在 repo 根目錄）：
#   docker compose up --build
# 開 http://localhost:8080 （port 被占用時：JD_PORT=8180 docker compose up）。沒有 artifacts/ 時民事與刑事會顯示示例資料，流程照樣走得完。
# 模型放 artifacts/（民事 civil_winloss_v1、retrieval_civil_v4；刑事 criminal_v1、retrieval_criminal_v1）；AI 整理敘述、AI 追問要在 .env 設定 JD_LLM_PROVIDER=gemini 與 GEMINI_API_KEY（範本 .env.example）。
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    volumes:
      - ./artifacts:/app/artifacts:ro
    env_file:
      - path: .env
        required: false
    environment:
      JD_CORS_ORIGINS: http://localhost:${JD_PORT:-8080}
    # 後端要載入模型與檢索資料，好了才開放前端，否則剛啟動時 API 會回 502
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 3s
      timeout: 5s
      retries: 40
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${JD_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

name: real model smoke

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "civil/**"
      - "criminal/**"
      - "retrieval/**"
      - "frontend/**"
      - "config.py"
      - "*requirements*.txt"
      - "scripts/download_smoke_models.py"
      - "tests/model_smoke.py"
      - ".github/model-smoke.json"
      - ".github/workflows/model-smoke.yml"
  schedule:
    - cron: "23 19 * * *" # Daily 03:23 Taipei; check HF main even without GitHub changes.
  workflow_dispatch:
    inputs:
      latest:
        description: "Check latest HF main (resolve once to a fixed commit SHA)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: model-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      JD_ARTIFACTS_DIR: ${{ github.workspace }}/.hf-smoke-artifacts
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install production runtime and browser
        run: |
          pip install -r backend/requirements.txt playwright==1.65.1
          python -m playwright install --with-deps chromium
      - name: Download immutable HF snapshot
        env:
          HF_TOKEN: ${{ secrets.HUGGINGFACE_CI_TOKEN }}
          CHECK_LATEST: ${{ github.event_name == 'schedule' || inputs.latest == true }}
        shell: bash
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::Set the repository Actions secret HUGGINGFACE_CI_TOKEN with read access to the private HF repo."
            exit 1
          fi
          args=()
          if [ "$CHECK_LATEST" = "true" ]; then args+=(--latest); fi
          python scripts/download_smoke_models.py --output "$JD_ARTIFACTS_DIR" "${args[@]}"
      - name: Build result pages
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Check real-model health, prediction and browser result pages
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: python -m tests.model_smoke
      - name: Save revision and smoke status (no models or judgment data)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-smoke-status
          path: |
            .hf-smoke-artifacts/smoke-revision.json
            .hf-smoke-artifacts/smoke-result.json
          retention-days: 14

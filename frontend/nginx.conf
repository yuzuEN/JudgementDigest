server {
    listen 80;
    root /usr/share/nginx/html;

    # API 轉給後端容器
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    # 單頁應用：任何網址都回 index.html，由前端的路由處理
    location / {
        try_files $uri /index.html;
    }
}

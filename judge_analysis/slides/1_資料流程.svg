<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="'Microsoft JhengHei','微軟正黑體','PingFang TC','Noto Sans TC','Heiti TC',sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8880"/></marker></defs>
<rect width="1600" height="900" fill="#fcfcfb"/>
<text x="64" y="84" font-size="44" font-weight="700" fill="#0b0b0b">資料流程</text>
<text x="64" y="134" font-size="27" fill="#52514e">爬取 → 解析 → 結構化 → 分析；結構化在解析當下完成，不需額外步驟</text>
<rect x="64" y="200" width="320" height="188" rx="14" fill="#2a78d6" fill-opacity="0.13" stroke="#2a78d6" stroke-width="3"/>
<text x="88" y="246" font-size="29" font-weight="700" fill="#0b0b0b">① 爬取</text>
<text x="88" y="284" font-size="23" fill="#52514e">crawler.py</text>
<text x="88" y="320" font-size="23" fill="#52514e">依裁判日期遞迴切分</text>
<text x="88" y="356" font-size="23" fill="#52514e">突破 500 筆上限</text>
<rect x="64" y="470" width="320" height="188" rx="14" fill="#6b7280" fill-opacity="0.13" stroke="#6b7280" stroke-width="3"/>
<text x="88" y="516" font-size="29" font-weight="700" fill="#0b0b0b">html_cache/</text>
<text x="88" y="554" font-size="23" fill="#52514e">12,417 份 HTML</text>
<text x="88" y="590" font-size="23" fill="#52514e">594 MB</text>
<text x="88" y="626" font-size="23" fill="#52514e">重新解析的唯一來源</text>
<rect x="470" y="200" width="380" height="332" rx="14" fill="#eb6834" fill-opacity="0.13" stroke="#eb6834" stroke-width="3"/>
<text x="494" y="246" font-size="29" font-weight="700" fill="#0b0b0b">② 解析 + 結構化</text>
<text x="494" y="284" font-size="23" fill="#52514e">html_parser.py</text>
<text x="494" y="320" font-size="23" fill="#52514e">　└ 30 個原始欄位</text>
<text x="494" y="356" font-size="23" fill="#52514e">structuring.py</text>
<text x="494" y="392" font-size="23" fill="#52514e">　└ 35 個推導欄位</text>
<text x="494" y="428" font-size="23" fill="#52514e"></text>
<text x="494" y="464" font-size="23" fill="#52514e">同一次呼叫完成</text>
<text x="494" y="500" font-size="23" fill="#52514e">新資料不需回填</text>
<rect x="940" y="200" width="300" height="188" rx="14" fill="#1baf7a" fill-opacity="0.13" stroke="#1baf7a" stroke-width="3"/>
<text x="964" y="246" font-size="29" font-weight="700" fill="#0b0b0b">judgments.db</text>
<text x="964" y="284" font-size="23" fill="#52514e">12,416 筆</text>
<text x="964" y="320" font-size="23" fill="#52514e">65 欄</text>
<text x="964" y="356" font-size="23" fill="#52514e">290 MB</text>
<rect x="940" y="470" width="300" height="224" rx="14" fill="#6b7280" fill-opacity="0.13" stroke="#6b7280" stroke-width="3"/>
<text x="964" y="516" font-size="29" font-weight="700" fill="#0b0b0b">backfill_</text>
<text x="964" y="554" font-size="23" fill="#52514e">structured.py</text>
<text x="964" y="590" font-size="23" fill="#52514e">規則改版時</text>
<text x="964" y="626" font-size="23" fill="#52514e">只重算 35 欄</text>
<text x="964" y="662" font-size="23" fill="#52514e">20 秒．不碰 HTML</text>
<rect x="1310" y="200" width="226" height="152" rx="14" fill="#eda100" fill-opacity="0.13" stroke="#eda100" stroke-width="3"/>
<text x="1334" y="246" font-size="29" font-weight="700" fill="#0b0b0b">③ 匯出</text>
<text x="1334" y="284" font-size="23" fill="#52514e">export_excel.py</text>
<text x="1334" y="320" font-size="23" fill="#52514e">62 欄 Excel</text>
<rect x="1310" y="470" width="226" height="188" rx="14" fill="#eda100" fill-opacity="0.13" stroke="#eda100" stroke-width="3"/>
<text x="1334" y="516" font-size="29" font-weight="700" fill="#0b0b0b">④ 分析</text>
<text x="1334" y="554" font-size="23" fill="#52514e">judge_analysis/</text>
<text x="1334" y="590" font-size="23" fill="#52514e">5 份 CSV</text>
<text x="1334" y="626" font-size="23" fill="#52514e">＋ 簡報圖</text>
<line x1="384" y1="290" x2="462" y2="290" stroke="#8a8880" stroke-width="3.5" marker-end="url(#ah)"/>
<line x1="224" y1="394" x2="224" y2="462" stroke="#8a8880" stroke-width="3.5" marker-end="url(#ah)"/>
<line x1="384" y1="540" x2="462" y2="400" stroke="#8a8880" stroke-width="3.5" marker-end="url(#ah)"/>
<line x1="850" y1="290" x2="932" y2="290" stroke="#8a8880" stroke-width="3.5" marker-end="url(#ah)"/>
<line x1="1060" y1="394" x2="1060" y2="462" stroke="#8a8880" stroke-width="3.5" marker-end="url(#ah)"/>
<line x1="1170" y1="462" x2="1170" y2="394" stroke="#8a8880" stroke-width="3.5" marker-end="url(#ah)" stroke-dasharray="9 7"/>
<line x1="1240" y1="290" x2="1302" y2="290" stroke="#8a8880" stroke-width="3.5" marker-end="url(#ah)"/>
<line x1="1240" y1="340" x2="1302" y2="520" stroke="#8a8880" stroke-width="3.5" marker-end="url(#ah)"/>
<text x="64" y="866" font-size="23" fill="#8a8880">虛線＝規則改版時的回填路徑；新爬的資料不需要它</text>
</svg>
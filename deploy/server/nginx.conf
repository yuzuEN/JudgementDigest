# 上線用的 nginx 設定（以一般使用者執行，所以暫存檔、pid 都放 /tmp）。
# 和 frontend/nginx.conf 的差別：聽 7860、後端在同一個容器（127.0.0.1:8000）、從 X-Forwarded-For 取使用者的 IP。
worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    client_body_temp_path /tmp/nginx_client_body;
    proxy_temp_path /tmp/nginx_proxy;
    fastcgi_temp_path /tmp/nginx_fastcgi;
    uwsgi_temp_path /tmp/nginx_uwsgi;
    scgi_temp_path /tmp/nginx_scgi;

    # 只記 IP、方法、路徑與狀態碼；輸入內容在 POST body，不會進 log。
    # 路徑用使用者原本要求的（$request_uri 去掉 ? 之後的查詢字串）：$uri 會被下面的單頁應用改寫成 /index.html，
    # 掃描程式試 /.env、/wp-login.php 時就看不出它試了什麼。
    map $request_uri $path_only {
        "~^([^?]*)" $1;
    }
    log_format brief '$remote_addr $request_method $path_only $status';
    access_log /dev/stdout brief;

    # 壓縮文字檔（前端 JS 約 570 KB → 170 KB），手機第一次打開才不會太慢
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 每個 IP 的 API 頻率與同時連線上限（以 real_ip 取出的使用者 IP 計）。刑度預測要跑 ELECTRA，很吃 CPU，
    # 不限制的話一個人狂打就能拖慢整台機器。正常操作一輪約 5～10 個請求。
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_req_status 429;
    limit_conn_status 429;

    server {
        listen 7860;
        root /app/static;

        # 使用者的連線經過 Tailscale Funnel 和 docker 轉進來，$remote_addr 會是 docker 閘道的 IP。
        # Funnel 把使用者的 IP 放在 X-Forwarded-For：從右邊往左跳過內網位址，取第一個外部位址。
        # 使用者自己偽造的 X-Forwarded-For 在最左邊，不會被取到。
        set_real_ip_from 10.0.0.0/8;
        set_real_ip_from 172.16.0.0/12;
        set_real_ip_from 192.168.0.0/16;
        set_real_ip_from 100.64.0.0/10;
        set_real_ip_from 127.0.0.1;
        set_real_ip_from fc00::/7;
        real_ip_header X-Forwarded-For;
        real_ip_recursive on;

        # API 轉給同一個容器裡的後端；後端用 X-Real-IP 算 LLM 的每 IP 用量
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            limit_conn perip 10;
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 60s;
        }

        # 建置產生的檔名帶內容雜湊（index-CCXg-rNI.js），內容變了檔名就變，可以讓瀏覽器長期快取
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # index.html 每次都向伺服器確認，部署新版後使用者才會拿到新的頁面
        location = /index.html {
            add_header Cache-Control "no-cache";
        }

        # 單頁應用：任何網址都回 index.html，由前端的路由處理
        location / {
            try_files $uri /index.html;
        }
    }
}
